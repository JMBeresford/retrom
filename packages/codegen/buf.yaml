version: v2
modules:
  - path: protos
lint:
  use:
    - COMMENTS
    - STANDARD
  except:
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - FILE_LOWER_SNAKE_CASE
    - IMPORT_USED
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_NO_IMPORT_CYCLE
    - PACKAGE_VERSION_SUFFIX
    - RPC_RESPONSE_STANDARD_NAME
  ignore:
    - protos/igdbapi.proto
    - protos/google
    - protos/retrom/services/saves/v1/saves-service.proto
    - protos/retrom/services/saves/v1/models.proto
breaking:
  use:
    - FILE
