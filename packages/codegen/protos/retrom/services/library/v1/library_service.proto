syntax = "proto3";

package retrom.services.library.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "retrom/services/library/v1/game.proto";
import "retrom/services/library/v1/library.proto";
import "retrom/services/library/v1/platform.proto";

// LibraryService provides CRUD and maintenance operations for library entities.
service LibraryService {
  // Starts a full library update scan.
  rpc ScanLibrary(ScanLibraryRequest) returns (ScanLibraryResponse);
  // Starts metadata refresh jobs.
  rpc UpdateLibraryMetadata(UpdateLibraryMetadataRequest) returns (UpdateLibraryMetadataResponse);
  // Deletes entries that no longer exist on disk.
  rpc DeleteMissingEntries(DeleteMissingEntriesRequest) returns (DeleteMissingEntriesResponse);

  // Gets a library by ID.
  rpc GetLibrary(GetLibraryRequest) returns (Library);
  // Lists libraries by filters.
  rpc ListLibraries(ListLibrariesRequest) returns (ListLibrariesResponse);
  // Creates one library.
  rpc CreateLibrary(CreateLibraryRequest) returns (Library);
  // Updates one library.
  rpc UpdateLibrary(UpdateLibraryRequest) returns (Library);
  // Deletes one library by ID.
  rpc DeleteLibrary(DeleteLibraryRequest) returns (google.protobuf.Empty);

  // Gets one platform by ID.
  rpc GetPlatform(GetPlatformRequest) returns (Platform);
  // Lists platforms by filters.
  rpc ListPlatforms(ListPlatformsRequest) returns (ListPlatformsResponse);
  // Creates one platform.
  rpc CreatePlatform(CreatePlatformRequest) returns (Platform);
  // Updates one platform.
  rpc UpdatePlatform(UpdatePlatformRequest) returns (Platform);
  // Deletes one platform by ID.
  rpc DeletePlatform(DeletePlatformRequest) returns (Platform);
  // Gets one or more platforms by ID.
  rpc BatchGetPlatforms(BatchGetPlatformsRequest) returns (BatchGetPlatformsResponse);

  // Gets one game by ID.
  rpc GetGame(GetGameRequest) returns (Game);
  // Lists games by filters.
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);
  // Creates one game.
  rpc CreateGame(CreateGameRequest) returns (Game);
  // Updates one game.
  rpc UpdateGame(UpdateGameRequest) returns (Game);
  // Deletes one game by ID.
  rpc DeleteGame(DeleteGameRequest) returns (Game);
}

// ScanLibraryRequest starts a full library scan/update.
message ScanLibraryRequest {}

// ScanLibraryResponse contains job IDs started by ScanLibrary.
message ScanLibraryResponse {
  // Job IDs started by the scan operation.
  repeated string job_ids = 1;
}

// UpdateLibraryMetadataRequest starts metadata refresh jobs.
message UpdateLibraryMetadataRequest {
  // When true, allows metadata providers to overwrite existing metadata.
  optional bool overwrite = 1;
}

// UpdateLibraryMetadataResponse contains metadata refresh job IDs.
message UpdateLibraryMetadataResponse {
  // Job IDs started by the scan operation.
  repeated string job_ids = 1;
}

// DeleteMissingEntriesRequest removes records for missing filesystem entries.
message DeleteMissingEntriesRequest {
  // When true, perform a dry run and only report what would be deleted.
  bool dry_run = 1;
}

// DeleteMissingEntriesResponse reports entities deleted by cleanup.
message DeleteMissingEntriesResponse {
  // Unique resource names of platforms deleted during cleanup.
  repeated string platforms = 1;

  // Unique resource names of games deleted during cleanup.
  repeated string games = 2;
}

// Request to fetch a library by ID.
message GetLibraryRequest {
  // Unique resource name of the library to fetch.
  // E.g. `libraries/{library}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Library"}
  ];
}

// Request to fetch libraries.
message ListLibrariesRequest {
  // The page size to return in the response. If not specified, a default page size will be used.
  optional int32 page_size = 1;

  // A token identifying a page of results the server should return. This is typically obtained from
  // the `next_page_token` field of a previous response.
  optional string page_token = 2;

  // Optional filter to match libraries by display name. This is a case-insensitive substring match.
  optional string display_name = 3;
}

// Response containing matching libraries.
message ListLibrariesResponse {
  // Libraries matching the requested filters.
  repeated Library libraries = 1;

  // A token identifying the next page of results, or empty if there are no more results.
  optional string next_page_token = 2;
}

// Request to create a library.
message CreateLibraryRequest {
  // Library to create.
  Library library = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to update a library.
message UpdateLibraryRequest {
  // Library to update.
  Library library = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteLibraryRequest deletes the specified library by ID.
message DeleteLibraryRequest {
  // Unique resource name of the library to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Library"}
  ];
}

// Request to fetch a platform by ID.
message GetPlatformRequest {
  // Unique resource name of the platform to fetch.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Platform"}
  ];
}

// Request to fetch platforms.
message ListPlatformsRequest {
  // The page size to return in the response. If not specified, a default page size will be used.
  optional int32 page_size = 1;

  // A token identifying a page of results the server should return. This is typically obtained from
  // the `next_page_token` field of a previous response.
  optional string page_token = 2;

  // Optional resource name of the parent library to filter platforms by. If specified, only platforms belonging
  // to this library will be returned.
  optional string parent = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Library"}
  ];

  // When true, include soft-deleted platforms.
  optional bool include_deleted = 4;

  // Optional filter to match platforms by title. This is a case-insensitive substring match.
  optional string title = 5;
}

// Response containing platforms and optional metadata.
message ListPlatformsResponse {
  // Platforms matching the requested filters.
  repeated Platform platforms = 1;

  // A token identifying the next page of results, or empty if there are no more results.
  optional string next_page_token = 2;
}

// Request to create a platform.
message CreatePlatformRequest {
  // Platform to create.
  Platform platform = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to update a platform.
message UpdatePlatformRequest {
  // Platform to update.
  Platform platform = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to delete a platform.
message DeletePlatformRequest {
  // Unique resource name of the platform to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Platform"}
  ];

  // When true, delete associated filesystem entries from disk. This
  // includes games and game files associated with the platform.
  optional bool delete_from_disk = 2 [(google.api.field_behavior) = OPTIONAL];

  // When true, soft-delete this platform's entries, such as games and game files, instead of hard-deleting.
  // Soft-deleted items will be excluded from normal queries but remain in the database for
  // potential recovery.
  optional bool soft_delete = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request to fetch multiple platforms.
message BatchGetPlatformsRequest {
  // Requests to fetch platforms.
  repeated GetPlatformRequest requests = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response containing fetched platforms.
message BatchGetPlatformsResponse {
  // Platforms fetched by the operation.
  repeated Platform platforms = 1;
}

// Request to fetch a game.
message GetGameRequest {
  // Unique resource name of the game to fetch.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Game"}
  ];
}

// Request to fetch games.
message ListGamesRequest {
  // The page size to return in the response. If not specified, a default page size will be used.
  optional int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // A token identifying a page of results the server should return. This is typically obtained from
  // the `next_page_token` field of a previous response.
  optional string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional resource name of the parent platform to filter games by. If specified, only games belonging
  // to this platform will be returned.
  optional string parent = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Platform"}
  ];

  // When true, include soft-deleted games.
  optional bool include_deleted = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional filter to match games by title. This is a case-insensitive substring match.
  optional string title = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response containing games, metadata, and game files.
message ListGamesResponse {
  // Games matching the requested filters.
  repeated Game games = 1;

  // A token identifying the next page of results, or empty if there are no more results.
  optional string next_page_token = 2;
}

// Request to create a game.
message CreateGameRequest {
  // Game to create.
  Game game = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to update a game.
message UpdateGameRequest {
  // Game to update.
  Game game = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to delete a game.
message DeleteGameRequest {
  // Unique resource name of the game to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Game"}
  ];

  // When true, delete associated filesystem entries from disk.
  optional bool delete_from_disk = 2 [(google.api.field_behavior) = OPTIONAL];

  // When true, soft-delete the game instead of hard-deleting. Soft-deleted
  // games will be excluded from normal queries but remain in the database for
  // potential recovery.
  optional bool soft_delete = 3 [(google.api.field_behavior) = OPTIONAL];
}
