syntax = "proto3";

package retrom.services.jobs.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "retrom/services/jobs/v1/job.proto";

// JobService defines the gRPC service for managing jobs in Retrom.
service JobService {
  // CreateJob creates a new job in Retrom.
  rpc CreateJob(CreateJobRequest) returns (Job);
  // GetJob retrieves a job by its unique identifier.
  rpc GetJob(GetJobRequest) returns (Job);
  // ListJobs retrieves a list of jobs, optionally filtered by status.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // UpdateJob updates the details of an existing job.
  rpc UpdateJob(UpdateJobRequest) returns (Job);
  // DeleteJob deletes a job by its unique identifier.
  rpc DeleteJob(DeleteJobRequest) returns (google.protobuf.Empty);
  // Streams JobProgress updates until the job reaches a terminal state.
  rpc WatchJob(WatchJobRequest) returns (stream WatchJobResponse);
}

// CreateJobRequest represents the request message for creating a new job in Retrom.
message CreateJobRequest {
  // Optional resource name for the parent of the job to be created. This could be
  // another Job, or a different resource type that this Job relates to.
  //
  // Format:
  //   - jobs/{job_id}
  //   - libraries/{library_id}/jobs/{job_id}
  optional string parent = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {child_type: "retrom.jmberesford.github.io/Job"}
  ];

  // Optional unique resource name for the job.
  // If not provided, one will be generated.
  optional string job_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // The job to be created.
  Job job = 3 [(google.api.field_behavior) = REQUIRED];
}

// GetJobRequest represents the request message for retrieving a job by its unique identifier.
message GetJobRequest {
  // The unique resource name of the job to retrieve.
  string name = 1 [(google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Job"}];
}

// ListJobsRequest represents the request message for retrieving a list of jobs, optionally filtered by status.
message ListJobsRequest {
  // The page size to return in the response. If not specified, a default page size will be used.
  optional int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // A token identifying a page of results the server should return. This is typically obtained from
  // the `next_page_token` field of a previous response.
  optional string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional resource name for the parent of the jobs to list.
  optional string parent = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {child_type: "retrom.jmberesford.github.io/Job"}
  ];

  // When provided, only jobs matching this status are returned.
  optional JobStatus status = 4 [(google.api.field_behavior) = OPTIONAL];
}

// ListJobsResponse represents the response message for retrieving a list of jobs.
message ListJobsResponse {
  // The list of jobs that were retrieved.
  repeated Job jobs = 1;

  // A token identifying the next page of results, or empty if there are no more results.
  optional string next_page_token = 2;
}

// Reports incremental progress on a running job.
message UpdateJobRequest {
  // The job to be updated.
  Job job = 1 [(google.api.field_behavior) = REQUIRED];

  // A field mask specifying which fields of the job to update. This allows for partial updates.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

// DeleteJobRequest represents the request message for deleting a job by its unique identifier.
message DeleteJobRequest {
  // The unique resource name of the job to delete.
  string name = 1 [(google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Job"}];
}

// WatchJobRequest represents the request message for watching a job's progress.
message WatchJobRequest {
  // The unique resource name of the job to watch for progress updates.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.jmberesford.github.io/Job"}
  ];
}

// WatchJobResponse represents a streamed update for a watched job.
message WatchJobResponse {
  // The job that is being watched.
  Job job = 1;
}
