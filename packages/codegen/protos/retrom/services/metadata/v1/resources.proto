syntax = "proto3";

package retrom.services.metadata.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

// GameMetadata represents a collection of metadata for a specific game.
message GameMetadata {
  option (google.api.resource) = {
    type: "retrom.services.metadata.v1.MetadataService/GameMetadata"
    singular: "gameMetadata"
    plural: "gameMetadata"
  };

  // The unique resource name of the game metadata record.
  // Format: `games/{game}/metadata`
  string name = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];
  // The ID of the game that this metadata is associated with.
  // For a resource name of the form `games/{game}/metadata`, this field will contain the value of `{game}`.
  string game = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp for when the game metadata record was created.
  google.protobuf.Timestamp created_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp for when the game metadata record was last updated.
  google.protobuf.Timestamp updated_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The title of the game.
  string title = 5;
  // A description of the game.
  optional string description = 6;
  // A URL to the game's cover image.
  optional string cover_url = 7;
  // A URL to the game's background image.
  optional string background_url = 8;
  // A URL to the game's icon image.
  optional string icon_url = 9;
  // A URL to the game's logo image.
  optional string logo_url = 10;
  // The release date of the game.
  optional google.protobuf.Timestamp release_date = 11;
  // The last time the game was played.
  optional google.protobuf.Timestamp last_played = 12;
  // The total number of minutes played for the game.
  optional int32 minutes_played = 13;
  // URLs to screenshots of the game.
  repeated string screenshots = 14;
  // URLs to artworks of the game.
  repeated string artworks = 15;
  // URLs to videos of the game.
  repeated string videos = 16;
  // URLs to external links related to the game (e.g. official website, store page).
  repeated string links = 17;
  // The IDs of similar games in the Retrom database.
  repeated string similar_games = 18;
}

// PlatformMetadata represents a collection of metadata for a specific platform.
message PlatformMetadata {
  option (google.api.resource) = {
    type: "retrom.services.metadata.v1.MetadataService/PlatformMetadata"
    singular: "platformMetadata"
    plural: "platformMetadata"
  };

  // The unique resource name of the platform metadata record.
  // Format: `platforms/{platform}/metadata`
  string name = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];
  // The ID of the platform that this metadata is associated with.
  string platform = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Timestamp for when the platform metadata record was created.
  google.protobuf.Timestamp created_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp for when the platform metadata record was last updated.
  google.protobuf.Timestamp updated_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The title of the platform.
  string title = 5;
  // A description of the platform.
  optional string description = 6;
  // A URL to the platform's background image.
  optional string background_url = 7;
  // A URL to the platform's icon image.
  optional string icon_url = 8;
  // A URL to the platform's logo image.
  optional string logo_url = 9;
}

// MetadataProvider represents a metadata provider in Retrom (e.g. IGDB, Steam).
message MetadataProvider {
  // The unique ID of the metadata provider.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The display name of the provider (e.g. "IGDB", "Steam").
  string name = 2 [(google.api.field_behavior) = IMMUTABLE];
  // Timestamp for when the metadata provider record was created.
  google.protobuf.Timestamp created_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Timestamp for when the metadata provider record was last updated.
  google.protobuf.Timestamp updated_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}
