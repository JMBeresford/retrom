syntax = "proto3";

package retrom.services.metadata.v1;

import "retrom/services/metadata/v1/resources.proto";

// MetadataProviderService defines the gRPC service for managing metadata providers in Retrom.
service MetadataProviderService {
  // ListMetadataProviders retrieves a list of all available metadata providers in Retrom.
  rpc ListMetadataProviders(ListMetadataProvidersRequest) returns (ListMetadataProvidersResponse);
}

// ListMetadataProvidersRequest represents the request message for retrieving a list of all
// available metadata providers in Retrom.
message ListMetadataProvidersRequest {}

// ListMetadataProvidersResponse represents the response message for retrieving a list of all
// available metadata providers in Retrom.
message ListMetadataProvidersResponse {
  // The list of available metadata providers in Retrom.
  repeated MetadataProvider providers = 1;
}
