syntax = "proto3";

package retrom.services.emulators.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "retrom/services/emulators/v1/default_emulator_profile.proto";
import "retrom/services/emulators/v1/emulator.proto";
import "retrom/services/emulators/v1/emulator_profile.proto";
import "retrom/services/emulators/v1/local_emulator_config.proto";

// EmulatorService defines the gRPC service for managing emulators, emulator profiles, local emulator configurations,
// and default emulator profiles in Retrom.
service EmulatorService {
  // GetEmulator retrieves a single emulator by its unique identifier.
  rpc GetEmulator(GetEmulatorRequest) returns (Emulator);
  // ListEmulators retrieves emulators based on the specified criteria, such as their IDs or supported platform IDs.
  rpc ListEmulators(ListEmulatorsRequest) returns (ListEmulatorsResponse);
  // CreateEmulator creates a new emulator in Retrom.
  rpc CreateEmulator(CreateEmulatorRequest) returns (Emulator);
  // UpdateEmulator updates an existing emulator in Retrom.
  rpc UpdateEmulator(UpdateEmulatorRequest) returns (Emulator);
  // DeleteEmulator deletes an emulator from Retrom by its unique identifier.
  rpc DeleteEmulator(DeleteEmulatorRequest) returns (google.protobuf.Empty);

  // GetEmulatorProfile retrieves a single emulator profile by its unique identifier.
  rpc GetEmulatorProfile(GetEmulatorProfileRequest) returns (EmulatorProfile);
  // ListEmulatorProfiles retrieves emulator profiles based on the specified criteria, such as their IDs or associated emulator IDs.
  rpc ListEmulatorProfiles(ListEmulatorProfilesRequest) returns (ListEmulatorProfilesResponse);
  // CreateEmulatorProfile creates a new emulator profile in Retrom.
  rpc CreateEmulatorProfile(CreateEmulatorProfileRequest) returns (EmulatorProfile);
  // UpdateEmulatorProfile updates an existing emulator profile in Retrom.
  rpc UpdateEmulatorProfile(UpdateEmulatorProfileRequest) returns (EmulatorProfile);
  // DeleteEmulatorProfile deletes an emulator profile from Retrom by its unique identifier.
  rpc DeleteEmulatorProfile(DeleteEmulatorProfileRequest) returns (google.protobuf.Empty);

  // GetDefaultEmulatorProfile retrieves a single default emulator profile by its unique identifier.
  rpc GetDefaultEmulatorProfile(GetDefaultEmulatorProfileRequest) returns (DefaultEmulatorProfile);
  // ListDefaultEmulatorProfiles retrieves default emulator profiles based on the specified criteria, such as platform IDs or client ID.
  rpc ListDefaultEmulatorProfiles(ListDefaultEmulatorProfilesRequest) returns (ListDefaultEmulatorProfilesResponse);
  // CreateDefaultEmulatorProfile creates a new default emulator profile in Retrom.
  rpc CreateDefaultEmulatorProfile(CreateDefaultEmulatorProfileRequest) returns (DefaultEmulatorProfile);
  // UpdateDefaultEmulatorProfile updates an existing default emulator profile in Retrom.
  rpc UpdateDefaultEmulatorProfile(UpdateDefaultEmulatorProfileRequest) returns (DefaultEmulatorProfile);
  // DeleteDefaultEmulatorProfile deletes a default emulator profile from Retrom by its unique identifier.
  rpc DeleteDefaultEmulatorProfile(DeleteDefaultEmulatorProfileRequest) returns (google.protobuf.Empty);

  // GetLocalEmulatorConfig retrieves a single local emulator configuration by its unique identifier.
  rpc GetLocalEmulatorConfig(GetLocalEmulatorConfigRequest) returns (LocalEmulatorConfig);
  // ListLocalEmulatorConfigs retrieves local emulator configurations based on the specified criteria, such as emulator IDs or client ID.
  rpc ListLocalEmulatorConfigs(ListLocalEmulatorConfigsRequest) returns (ListLocalEmulatorConfigsResponse);
  // CreateLocalEmulatorConfig creates a new local emulator configuration in Retrom.
  rpc CreateLocalEmulatorConfig(CreateLocalEmulatorConfigRequest) returns (LocalEmulatorConfig);
  // UpdateLocalEmulatorConfig updates an existing local emulator configuration in Retrom.
  rpc UpdateLocalEmulatorConfig(UpdateLocalEmulatorConfigRequest) returns (LocalEmulatorConfig);
  // DeleteLocalEmulatorConfig deletes a local emulator configuration from Retrom by its unique identifier.
  rpc DeleteLocalEmulatorConfig(DeleteLocalEmulatorConfigRequest) returns (google.protobuf.Empty);
}

// Request to fetch an emulator by ID.
message GetEmulatorRequest {
  // ID of the emulator to fetch.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.services.emulators.v1.EmulatorService/Emulator"}
  ];
}

// Request to fetch emulators by filters.
message ListEmulatorsRequest {
  // Optional emulator IDs to filter by.
  repeated string ids = 1;
  // Optional platform IDs to filter by. Only emulators that support at least one of the provided platform IDs will be returned.
  repeated string supported_platform_ids = 2;
}

// Response containing matching emulators.
message ListEmulatorsResponse {
  // Emulators matching the requested filters.
  repeated Emulator emulators = 1;
}

// Request to create an emulator.
message CreateEmulatorRequest {
  // Emulator to create.
  Emulator emulator = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to update an emulator.
message UpdateEmulatorRequest {
  // Emulator to update.
  Emulator emulator = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to delete an emulator by ID.
message DeleteEmulatorRequest {
  // ID of the emulator to delete.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.services.emulators.v1.EmulatorService/Emulator"}
  ];
}

// Request to fetch an emulator profile by ID.
message GetEmulatorProfileRequest {
  // ID of the emulator profile to fetch.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.services.emulators.v1.EmulatorService/EmulatorProfile"}
  ];
}

// Request to fetch emulator profiles by filters.
message ListEmulatorProfilesRequest {
  // Optional emulator profile IDs to filter by.
  repeated string ids = 1;
  // Optional emulator IDs to filter by. Only profiles belonging to one of the provided emulator IDs will be returned.
  repeated string emulator_ids = 2;
}

// Response containing matching emulator profiles.
message ListEmulatorProfilesResponse {
  // Emulator profiles matching the requested filters.
  repeated EmulatorProfile emulator_profiles = 1;
}

// Request to create an emulator profile.
message CreateEmulatorProfileRequest {
  // Emulator profile to create.
  EmulatorProfile emulator_profile = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to update an emulator profile.
message UpdateEmulatorProfileRequest {
  // Emulator profile to update.
  EmulatorProfile emulator_profile = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to delete an emulator profile by ID.
message DeleteEmulatorProfileRequest {
  // ID of the emulator profile to delete.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.services.emulators.v1.EmulatorService/EmulatorProfile"}
  ];
}

// Request to fetch a default emulator profile by ID.
message GetDefaultEmulatorProfileRequest {
  // ID of the default emulator profile to fetch.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.services.emulators.v1.EmulatorService/DefaultEmulatorProfile"}
  ];
}

// Request to fetch default emulator profiles by filters.
message ListDefaultEmulatorProfilesRequest {
  // Optional platform IDs to filter by. Only default profiles for one of the provided platform IDs will be returned.
  repeated string platform_ids = 1;
  // Optional client ID to filter by. Only default profiles for this client will be returned.
  optional string client_id = 2;
}

// Response containing matching default emulator profiles.
message ListDefaultEmulatorProfilesResponse {
  // Default emulator profiles matching the requested filters.
  repeated DefaultEmulatorProfile default_emulator_profiles = 1;
}

// Request to create a default emulator profile.
message CreateDefaultEmulatorProfileRequest {
  // Default emulator profile to create.
  DefaultEmulatorProfile default_emulator_profile = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to update a default emulator profile.
message UpdateDefaultEmulatorProfileRequest {
  // Default emulator profile to update.
  DefaultEmulatorProfile default_emulator_profile = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to delete a default emulator profile by ID.
message DeleteDefaultEmulatorProfileRequest {
  // ID of the default emulator profile to delete.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.services.emulators.v1.EmulatorService/DefaultEmulatorProfile"}
  ];
}

// Request to fetch a local emulator configuration by ID.
message GetLocalEmulatorConfigRequest {
  // ID of the local emulator configuration to fetch.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.services.emulators.v1.EmulatorService/LocalEmulatorConfig"}
  ];
}

// Request to fetch local emulator configurations by filters.
message ListLocalEmulatorConfigsRequest {
  // Optional emulator IDs to filter by. Only configurations belonging to one of the provided emulator IDs will be returned.
  repeated string emulator_ids = 1;
  // Optional client ID to filter by. Only configurations for this client will be returned.
  optional string client_id = 2;
}

// Response containing matching local emulator configurations.
message ListLocalEmulatorConfigsResponse {
  // Local emulator configurations matching the requested filters.
  repeated LocalEmulatorConfig local_emulator_configs = 1;
}

// Request to create a local emulator configuration.
message CreateLocalEmulatorConfigRequest {
  // Local emulator configuration to create.
  LocalEmulatorConfig local_emulator_config = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to update a local emulator configuration.
message UpdateLocalEmulatorConfigRequest {
  // Local emulator configuration to update.
  LocalEmulatorConfig local_emulator_config = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request to delete a local emulator configuration by ID.
message DeleteLocalEmulatorConfigRequest {
  // ID of the local emulator configuration to delete.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "retrom.services.emulators.v1.EmulatorService/LocalEmulatorConfig"}
  ];
}
