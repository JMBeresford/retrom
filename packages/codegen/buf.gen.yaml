version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: src/gen/ts
    include_imports: true
    opt: target=ts,json_types=true

  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: src/gen/rs
    opt:
      - bytes=.
      - compile_well_known_types
      - extern_path=.google.protobuf=::pbjson_types
      - extern_path=.google.protobuf.Timestamp=crate::timestamp::Timestamp
      - type_attribute=retrom.services.clients.v1.Client=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.library.v1.LibraryRow=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.library.v1.RootDirectoryRow=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.library.v1.PlatformRow=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.library.v1.GameRow=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.library.v1.GameFileRow=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.metadata.v1.GameMetadata=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.metadata.v1.PlatformMetadata=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.metadata.v1.GameMetadataArtwork=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.metadata.v1.GameMetadataScreenshot=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.metadata.v1.GameMetadataVideo=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.metadata.v1.GameMetadataLink=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.metadata.v1.MetadataProvider=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.emulators.v1.Emulator=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.emulators.v1.EmulatorPlatform=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.emulators.v1.EmulatorOperatingSystem=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.emulators.v1.EmulatorProfile=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.emulators.v1.EmulatorProfileExtension=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.emulators.v1.DefaultEmulatorProfile=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.emulators.v1.LocalEmulatorConfig=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.tags.v1.TagDomain=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - type_attribute=retrom.services.tags.v1.Tag=#[derive(sqlx::FromRow)]#[sqlx(default)]
      - file_descriptor_set

  - remote: buf.build/community/neoeinstein-prost-serde:v0.4.0
    out: src/gen/rs

  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: src/gen/rs
    opt:
      - compile_well_known_types
      - extern_path=.google.protobuf=::pbjson_types
      - extern_path=.google.protobuf.Timestamp=crate::timestamp::Timestamp

  - remote: buf.build/community/neoeinstein-prost-crate:v0.5.0
    out: src/gen/rs
    opt:
      - no_features
