name: Build Nix Flake

on:
  workflow_call:
    secrets:
      CACHIX_TOKEN:
        required: true
  workflow_dispatch:

jobs:
  build:
    name: Build Nix Flake
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Print nixpkgs version
        run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'

      - uses: cachix/cachix-action@v17
        with:
          name: retrom
          authToken: "${{ secrets.CACHIX_TOKEN }}"

      - name: Build packages
        run: nix build .#retrom-unwrapped .#retrom-service

      - name: Pin release builds
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        run: |
          for pkg in retrom-unwrapped retrom-service; do
            path="$(nix path-info ".#$pkg")"
            cachix push retrom "$path"
            cachix pin retrom "$pkg" "$path" --keep-revisions 2
          done
